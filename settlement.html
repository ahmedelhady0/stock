<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسوية / مرتجع - نظام مخزن شركة العزل</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-4 md:p-8 min-h-screen">
    <div class="container p-6 md:p-8 w-full max-w-2xl mx-auto">
        <a href="home.html" class="back-link block mb-4">→ رجوع للرئيسية</a>
        <h1 class="text-2xl font-bold text-center mb-6 text-amber-700">⚖️ تسوية / مرتجع</h1>

        <div class="section-card p-6 space-y-6">
            <div>
                <label class="block text-sm font-semibold mb-2">المشروع</label>
                <select id="settleProject" class="input-field w-full p-3"></select>
            </div>

            <div>
                <label class="block text-sm font-semibold mb-2">المرحلة</label>
                <select id="settlePhase" class="input-field w-full p-3" disabled></select>
            </div>

            <div>
                <label class="block text-sm font-semibold mb-2">المادة</label>
                <select id="settleMaterial" class="input-field w-full p-3" disabled></select>
            </div>

            <div class="grid grid-cols-3 gap-4">
                <div>
                    <label class="block text-sm font-semibold mb-2">متبقي في العربية</label>
                    <input type="number" id="remainingInCar" class="input-field w-full p-3 text-center" placeholder="0">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-2">مرتجع للمستودع</label>
                    <input type="number" id="returnToStore" class="input-field w-full p-3 text-center" placeholder="0">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-2">مرتجع للمورد</label>
                    <input type="number" id="returnToSupplier" class="input-field w-full p-3 text-center" placeholder="0">
                </div>
            </div>

            <div>
                <label class="block text-sm font-semibold mb-2">ملاحظات</label>
                <textarea id="settleNotes" rows="3" class="input-field w-full p-3"></textarea>
            </div>

            <button onclick="submitSettlement()" class="w-full py-4 bg-amber-600 text-white font-bold rounded-2xl">
                حفظ التسوية
            </button>
        </div>
    </div>

    <script type="module" src="settlement.js"></script>
</body>
</html>
