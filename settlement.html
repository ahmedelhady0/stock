<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مرتجع مواد - نظام مخزن شركة العزل</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-4 md:p-8 min-h-screen bg-gradient-to-br from-amber-50 to-orange-50">
    <div class="container p-6 md:p-8 w-full max-w-2xl mx-auto fade-in">
        <a href="history.html" class="back-link block mb-4">→ رجوع لسجل الحركات</a>
        <h1 class="text-2xl font-bold text-center mb-2 title-gradient">🔄 مرتجع مواد</h1>
        <p class="text-center text-sm text-gray-500 mb-6">تسجيل مرتجع مواد من المشروع (يخصم من الاستهلاك)</p>

        <div class="section-card p-6 space-y-6">
            <div id="modalError" class="hidden bg-red-50 border border-red-200 text-red-700 text-sm font-semibold p-3 rounded-xl text-center"></div>
            <div>
                <label class="block text-sm font-semibold mb-2">اختر المشروع</label>
                <select id="returnProject" class="input-field w-full p-3">
                    <option value="">اختر المشروع...</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-semibold mb-2">المادة</label>
                <select id="returnMaterial" class="input-field w-full p-3" disabled>
                    <option value="">اختر المشروع أولاً</option>
                </select>
            </div>

            <div class="flex gap-3">
                <label class="flex-1 flex items-center justify-center gap-2 bg-white p-3 rounded-xl border-2 border-indigo-300 cursor-pointer hover:bg-indigo-50 transition" id="destStoreLabel">
                    <input type="radio" name="returnDest" value="warehouse" checked class="accent-indigo-600">
                    <span class="text-sm font-bold text-indigo-700">🏠 مرتجع مستودع</span>
                </label>
                <label class="flex-1 flex items-center justify-center gap-2 bg-white p-3 rounded-xl border-2 border-orange-300 cursor-pointer hover:bg-orange-50 transition" id="destSupplierLabel">
                    <input type="radio" name="returnDest" value="supplier" class="accent-orange-600">
                    <span class="text-sm font-bold text-orange-700">🚚 مرتجع مورد</span>
                </label>
            </div>

            <div id="returnSupplierWrap" class="hidden">
                <label class="block text-sm font-semibold mb-2">اختر المورد</label>
                <select id="returnSupplier" class="input-field w-full p-3">
                    <option value="">اختر المورد...</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-semibold mb-2">الكمية المرتجعة</label>
                <input type="number" id="returnQty" min="0" step="any" class="input-field w-full p-3 text-center text-lg font-bold" placeholder="0">
                <p class="text-xs text-gray-500 mt-1">الاستهلاك الحالي لهذه المادة: <span id="currentConsumption" class="font-bold text-indigo-700">0</span></p>
            </div>

            <div>
                <label class="block text-sm font-semibold mb-2">ملاحظات (اختياري)</label>
                <textarea id="returnNotes" rows="2" class="input-field w-full p-3" placeholder="سبب الإرجاع..."></textarea>
            </div>

            <button id="submitReturnBtn" class="w-full py-4 bg-amber-600 text-white font-bold rounded-2xl hover:bg-amber-700 disabled:bg-gray-400">
                تسجيل المرتجع
            </button>
        </div>
    </div>

    <div id="messageBox" class="fixed inset-0 modal-backdrop hidden items-center justify-center p-4">
        <div class="modal-content p-6 shadow-xl w-full max-w-sm text-center">
            <p id="messageText" class="text-gray-800 font-medium mb-4"></p>
            <button id="closeMessageBtn" class="w-full py-3 px-6 btn-primary">إغلاق</button>
        </div>
    </div>

    <script type="module" src="settlement.js"></script>
</body>
</html>
