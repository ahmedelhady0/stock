<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حركة مواد - نظام مخزن شركة العزل</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="p-4 md:p-8 min-h-screen bg-gradient-to-br from-indigo-50 to-purple-50">
    <div class="container p-6 md:p-8 w-full max-w-2xl mx-auto fade-in">
        <a href="home.html" class="back-link block mb-4">→ رجوع للرئيسية</a>

        <h1 class="text-2xl font-bold text-center mb-2 title-gradient">📦 حركة مواد</h1>
        <p class="text-center text-sm text-gray-500 mb-6" id="subtitle">تسجل استهلاك مباشر على المشروع</p>

        <div class="section-card p-6 space-y-6">
            <!-- نوع الحركة -->
            <div class="bg-indigo-50 p-4 rounded-2xl border border-indigo-100">
                <label class="block text-sm font-bold text-indigo-800 mb-3">نوع الحركة</label>
                <div class="flex gap-3">
                    <label class="flex-1 flex items-center justify-center gap-2 bg-white p-3 rounded-xl border-2 border-emerald-400 cursor-pointer hover:bg-emerald-50 transition" id="directLabel">
                        <input type="radio" name="movementType" value="direct" checked class="accent-emerald-600">
                        <span class="font-bold text-emerald-700 text-sm">🚚 صرف مباشر للمشروع</span>
                    </label>
                    <label class="flex-1 flex items-center justify-center gap-2 bg-white p-3 rounded-xl border-2 border-blue-300 cursor-pointer hover:bg-blue-50 transition" id="warehouseLabel">
                        <input type="radio" name="movementType" value="warehouse" class="accent-blue-600">
                        <span class="font-bold text-blue-700 text-sm">🏠 تخزين في المستودع</span>
                    </label>
                </div>
                <p class="text-xs text-gray-500 mt-2 text-center" id="typeHint">✅ يستهلك تلقائياً على المشروع - لا يحتاج تسوية</p>
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">المشروع</label>
                <div class="flex gap-2">
                    <select id="matProject" required class="input-field block w-full p-3"></select>
                    <button type="button" id="refreshBtn" class="px-4 rounded-xl border-2 border-gray-300 text-gray-500 hover:bg-gray-100 transition" title="تحديث القوائم">
                        ⟳
                    </button>
                </div>
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">المرحلة</label>
                <select id="matPhase" required class="input-field block w-full p-3" disabled>
                    <option value="">اختر المشروع أولاً</option>
                </select>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">المورد</label>
                    <select id="matSupplier" class="input-field block w-full p-3"></select>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">رقم الفاتورة</label>
                    <input type="text" id="invoiceNo" class="input-field block w-full p-3" placeholder="رقم الفاتورة (اختياري)">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">صورة الفاتورة (اختياري)</label>
                    <input type="file" id="invoiceFile" accept="image/*" capture="environment" class="block w-full text-sm text-gray-600 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:bg-indigo-50 file:text-indigo-700 file:font-semibold hover:file:bg-indigo-100 cursor-pointer">
                    <p class="text-xs text-gray-400 mt-1">تترفع على Google Drive وتتسجل كرابط في الشيت</p>
                </div>
            </div>

            <div class="bg-emerald-50 p-5 rounded-2xl border border-emerald-100">
                <h3 class="text-sm font-bold text-emerald-800 mb-4" id="materialsHeading">المواد (الكمية = استهلاك على المشروع)</h3>
                <div id="dynamicMaterialsContainer" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <!-- يتم ملؤها ديناميكياً -->
                </div>
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">ملاحظات</label>
                <textarea id="motionNotes" rows="3" class="input-field block w-full p-3" placeholder="فاتورة، ملاحظات، إلخ..."></textarea>
            </div>

            <div class="flex gap-3 pt-4">
                <button onclick="location.reload()" class="flex-1 py-4 font-bold bg-gray-200 text-gray-700 rounded-2xl">تفريغ النموذج</button>
                <button id="submitBtn" onclick="submitReceipt()" class="flex-1 py-4 font-bold text-white rounded-2xl hover:brightness-110 disabled:opacity-60 bg-emerald-600" disabled>
                    حفظ الحركة
                </button>
            </div>
        </div>
    </div>

    <div id="messageBox" class="fixed inset-0 modal-backdrop hidden items-center justify-center p-4">
        <div class="modal-content p-6 shadow-xl w-full max-w-sm text-center">
            <p id="messageText" class="text-gray-800 font-medium mb-4"></p>
            <button id="closeMessageBtn" class="w-full py-3 px-6 btn-primary">إغلاق</button>
        </div>
    </div>

    <script type="module" src="deliveryService.js"></script>
</body>
</html>
