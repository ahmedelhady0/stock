<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إضافة مشروع / مادة - مخزن شركة العزل</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-4 md:p-8 min-h-screen">
    <div class="container p-6 md:p-8 w-full max-w-2xl mx-auto fade-in">
        <a href="home.html" class="back-link">→ رجوع للرئيسية</a>

        <h1 class="text-2xl title-gradient mb-1">➕ إضافة جديدة</h1>
        <p class="text-sm text-gray-500 mb-6">إضافة مشروع جديد أو مادة للشيتات</p>

        <!-- ═══ إضافة مشروع ═══ -->
        <div class="section-card p-6 mb-6">
            <div class="form-header mb-4">
                <span class="form-header-icon" style="background:linear-gradient(135deg,#667eea,#764ba2);">🏗️</span>
                <div class="flex-1">
                    <h2 class="font-bold text-indigo-900 text-lg">مشروع جديد</h2>
                    <p class="text-xs text-gray-500">يتعمل 5 صفوف تلقائياً (صف لكل مرحلة: فوم، اسمنتي، دورات مياه، رولات، مضاف خرسانة)</p>
                </div>
            </div>
            <form id="addProjectForm" class="flex gap-3">
                <input type="text" id="newProjectName" required class="input-field flex-1 p-3" placeholder="اسم المشروع (مثال: مشروع خزان حي المعزل ابو محمد)">
                <button type="submit" class="btn-primary px-6 font-bold whitespace-nowrap">إضافة</button>
            </form>
        </div>

        <!-- ═══ إضافة مادة ═══ -->
        <div class="section-card p-6">
            <div class="form-header mb-4">
                <span class="form-header-icon" style="background:linear-gradient(135deg,#f59e0b,#d97706);">📦</span>
                <div class="flex-1">
                    <h2 class="font-bold text-indigo-900 text-lg">مادة جديدة</h2>
                    <p class="text-xs text-gray-500">تختار المرحلة (اسم مختصر للبند) والباقي يتعبى أوتوماتيك في شيت المواد</p>
                </div>
            </div>
            <form id="addMaterialForm" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1.5">المرحلة (اسم مختصر للبند)</label>
                    <select id="newMaterialPhase" required class="input-field px-3 py-2.5 w-full"></select>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1.5">البند</label>
                    <input type="text" id="newMaterialBond" class="input-field px-3 py-2.5 w-full bg-gray-100 text-gray-500" readonly>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1.5">المواد المستخدمة</label>
                    <input type="text" id="newMaterialName" required class="input-field px-3 py-2.5 w-full" placeholder="مثال: برميل اسود">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1.5">الوحدة</label>
                    <input type="text" id="newMaterialUnit" required class="input-field px-3 py-2.5 w-full" placeholder="مثال: برميل / كيس / لفه">
                </div>
                <div class="sm:col-span-2">
                    <label class="block text-sm font-semibold text-gray-700 mb-1.5">السعر (ر.س) <span class="text-xs text-gray-400">(اختياري)</span></label>
                    <input type="number" id="newMaterialPrice" step="0.01" min="0" class="input-field px-3 py-2.5 w-full" placeholder="مثال: 2420.00">
                </div>
                <div class="sm:col-span-2">
                    <button type="submit" class="btn-primary w-full py-3 font-bold">📦 إضافة المادة</button>
                </div>
            </form>
        </div>
    </div>

    <!-- مودال الرسائل -->
    <div id="messageBox" class="fixed inset-0 modal-backdrop hidden items-center justify-center p-4">
        <div class="modal-content p-6 shadow-xl w-full max-w-sm text-center">
            <p id="messageText" class="text-gray-800 font-medium mb-4">رسالة النظام تظهر هنا</p>
            <button id="closeMessageBtn" class="w-full py-2 px-4 btn-primary text-sm font-medium">إغلاق</button>
        </div>
    </div>

    <style>
        .form-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding-bottom: 14px;
            border-bottom: 2px solid rgba(102, 126, 234, 0.15);
        }
        .form-header-icon {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            font-size: 20px;
        }
    </style>

    <script type="module" src="addItems.js"></script>
</body>
</html>
